<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Audio Waves Visualizer</title>
    <script>
      // 保存した配色を描画前に反映する（ライトモードでの一瞬の黒いちらつきを防ぐ）
      try {
        if (localStorage.getItem("awv.theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
